name: Étiquetages magiques à quatre classes et croix ansée — comptes, absences, équivalences

# Les scripts de la livraison 13 d'Anibal (8 octobre 2026) :
#   - enum6.py énumère les 18 432 étiquetages magiques d'ordre 6 et les trie en
#     pavables (8 192, seize motifs chacun) et non pavables ; il sort en erreur
#     si l'un de ces comptes bouge. Environ 2 min 30 dans un conteneur.
#   - graine_sat.py --ordre 2 : le solveur CP-SAT conclut à l'absence
#     (INFEASIBLE). Le script ne sort pas en erreur de lui-même ; c'est
#     check_sorties_ci.mjs qui exige la ligne « AUCUN étiquetage … ».
# Livraison 14.10 (9 octobre 2026), la croix ansée à l'ordre n :
#   - croix_auto.py, après enum6.py dont il lit le cache pavables6.json :
#     l'équivalence colonne = croix ansée = pavable sur les 18 432 ; sort en
#     erreur si elle tombe.
#   - compte_figures.py : rang n − 1 et 2^((n² − 6n + 4)/4) figures candidates
#     jusqu'à l'ordre 42 ; sort en erreur si le rang ou la formule bougent.
#   - compte_croix.py --ordre 6 : les 2 candidates, réalisables.
#   - croix_existence.py --ordres 6,8,12 : les ordres dont la sortie ne dépend
#     pas du carré rendu par le solveur (aux ordres 10, 14, 18 les traits par
#     ligne changent d'une exécution à l'autre).
#   - ligne_necessaire.py : sort en erreur si un carré viole |d·u| ≤ (n−1)/2.
#   - profils.py --ordre 6 : les profils symétriques (10,10,8,8) et (12,12,6,6)
#     existent, les autres sont INFEASIBLE (1 s).
# Dépôt 15.11 (9 octobre 2026), cinq scripts en Python nu (sans ortools) :
#   - verifie_temoins.py : les 29 témoins de data/temoins.json recalculés ;
#     sort en erreur si l'un ne passe pas.
#   - identite.py : l'identité exacte et la forme (*) sur les 18 432 (cache
#     d'enum6.py) et sur les témoins ; sort en erreur si elle tombe.
#   - exhaustif6.py : les 18 432 × 256 couples graine/motif, {0: 10240,
#     16: 8192} ; sort en erreur si le partage bouge.
#   - reseau.py --ordres 8,12,16,20 --fenetre 0 : aucun vecteur d'écarts nul
#     aux ordres doublement pairs testés, sans solveur.
#   - parite.py : l'identité δ_0 = n(n−1)·A + W sur les 279 616 configurations
#     des ordres 4 à 10, et la réciproque locale aux ordres 6 à 34 (dépôt 15.14).
#   - verifie_portee.py (dépôt 15.14) : la nécessité de la règle des miroirs sur
#     284 graines non invariantes, sans solveur ; sort en erreur sur un échec.
# Dépôt 15.34 (9 octobre 2026), deux scripts en Python nu :
#   - construction.py : --existence (un étiquetage magique à tout ordre pair
#     n ≥ 4, l'ordre 2 seul impossible), la figure canonique aux ordres 2 à 50,
#     toutes les figures des ordres 6 et 10 (29 s), et un échantillon ; chaque
#     commande sort en erreur si une construction échoue. check_sorties_ci.mjs
#     ne relit que la première (--existence) ; les autres ont leur journal.
#   - recollement.py : --profils (8 192 à l'ordre 6, 0 aux ordres 4 et 8, lignes
#     relues), --table (sort en erreur sur un écart), --construit et --geometrie
#     (journal). L'ordre 10 (~6 min et 5 Go) a son journal dans
#     docs/journaux/2026-10-09/.
# Dépôt 15.37 (9 octobre 2026, archive du dépôt Zenodo 10.5281/zenodo.23269974) :
#   - fibres.py --ordres 6,10 : la fibre de la projection « étiquetage ↦ figure »,
#     4 096 par figure à l'ordre 6, trois tailles à l'ordre 10 ; sort en erreur si
#     la somme des fibres diffère du total de recollement.py (66 s).
# Les scripts à solveur du dépôt 15.11 (localise, ecarts, congruences) ont leur
# journal dans docs/journaux/2026-10-08/.
# Les scripts plus longs (suite_croix, parite_suit, profils à l'ordre 10, croix_ansee_n,
# compte_croix aux ordres 8, 10, 12, 14, croix_existence à l'ordre 16) ont leur
# journal dans docs/journaux/2026-10-08/.
# Job à part de check-referents.yml : check_sorties_ci.mjs relance chaque script
# cité, et enum6.py ne doit pas allonger le job des référents.
# compte_etiquetages.py (ordres 2, 4, 6, 8) et portee_miroirs.py ont leurs
# journaux dans docs/journaux/2026-10-08/ (statut verifie_journal_local).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ortools==9.15.6755
      - run: python3 tools/enum6.py
      - run: python3 tools/graine_sat.py --ordre 2 --limite 60
      - run: python3 tools/croix_auto.py
      - run: python3 tools/compte_figures.py
      - run: python3 tools/compte_croix.py --ordre 6
      - run: python3 tools/croix_existence.py --ordres 6,8,12
      - run: python3 tools/ligne_necessaire.py --ordres 6,10,14,18
      - run: python3 tools/profils.py --ordre 6
      - run: python3 tools/verifie_temoins.py
      - run: python3 tools/identite.py
      - run: python3 tools/exhaustif6.py
      - run: python3 tools/reseau.py --ordres 8,12,16,20 --fenetre 0
      - run: python3 tools/parite.py
      - run: python3 tools/verifie_portee.py
      - run: python3 tools/construction.py --existence
      - run: python3 tools/construction.py --ordres 2,4,6,8,10,14,18,22,26,30,34,38,42,46,50
      - run: python3 tools/construction.py --toutes
      - run: python3 tools/construction.py --echantillon 20 --ordres 6,10,14,18,22,26,30
      - run: python3 tools/fibres.py --ordres 6,10
      - run: python3 tools/recollement.py --ordres 4,6,8 --profils
      - run: python3 tools/recollement.py --ordres 4,6,8,10,12,14 --table
      - run: python3 tools/recollement.py --ordres 6,10,14,18 --construit
      - run: python3 tools/recollement.py --ordres 4,6,8,10,12,14 --geometrie
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-etiquetages.yml
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-etiquetages.yml --essai
