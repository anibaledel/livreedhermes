name: Index des référents — data/referents.json dit les fichiers, codes et résultats compris

# data/referents.json et data/SHA256SUMS.txt (écrits par tools/index_referents.mjs)
# listent les référents de données du site : adresse, empreinte, clés de
# version, générateur, vérificateurs, pages. --verifie échoue dès qu'un
# référent diverge de son entrée (un octet suffit) ; --essai fausse une
# empreinte puis un référent, et montre que le contrôle refuse.
#
# Même discipline pour data/codes.json (tools/index_codes.mjs : l'index des
# scripts, relu dans le dépôt) et data/resultats-etablis.json
# (tools/check_resultats_etablis.mjs : chaque ligne citée relue dans la copie
# du journal déposé, chaque empreinte comparée à l'instantané Zenodo).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: node tools/index_referents.mjs --verifie
      - run: node tools/index_referents.mjs --essai
      - run: cd data && sha256sum -c SHA256SUMS.txt
      - run: node tools/index_codes.mjs --verifie
      - run: node tools/index_codes.mjs --essai
      - run: node tools/verify_comptes_couleurs.mjs
      - run: python3 tools/verify_quadricolore.py --json
      - run: python3 tools/verify_cle_couleurs.py
      - run: python3 tools/verify_cle_damier.py
      - run: python3 tools/verify_pont_formes.py
      - run: python3 tools/protocole_general.py
      - run: python3 tools/pavage_miroirs.py
      - run: python3 tools/verify_cle_pied.py
      - run: python3 tools/verify_invariants.py
      - run: python3 tools/transcription.py --json
      - run: python3 tools/verify_echelle.py
      - run: python3 tools/verify_cadres_ordre12.py
      - run: node tools/check_resultats_etablis.mjs
      - run: node tools/check_resultats_etablis.mjs --essai
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-referents.yml
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-referents.yml --essai
