name: Index des référents — data/referents.json dit les fichiers, codes et résultats compris

# data/referents.json et data/SHA256SUMS.txt (écrits par tools/index_referents.mjs)
# listent les référents de données du site : adresse, empreinte, clés de
# version, générateur, vérificateurs, pages. --verifie échoue dès qu'un
# référent diverge de son entrée (un octet suffit) ; --essai fausse une
# empreinte puis un référent, et montre que le contrôle refuse.
#
# Même discipline pour data/codes.json (tools/index_codes.mjs : l'index des
# scripts, relu dans le dépôt) et data/resultats-etablis.json
# (tools/check_resultats_etablis.mjs : chaque ligne citée relue dans la copie
# du journal déposé, chaque empreinte comparée à l'instantané Zenodo).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: node tools/index_referents.mjs --verifie
      - run: node tools/index_referents.mjs --essai
      - run: cd data && sha256sum -c SHA256SUMS.txt
      - run: node tools/index_codes.mjs --verifie
      - run: node tools/index_codes.mjs --essai
      # le corpus binaire des animations (prompt 209) : recalculé depuis le référent des 360 calques et la lecture binaire ; --essai : des fichiers faussés sont refusés
      - run: node tools/corpus_256.mjs --verifie
      - run: node tools/corpus_256.mjs --essai
      - run: node tools/check_spectre_classes.mjs --essai
      # les variantes de fonds sur le corpus de 64 (prompt 210) : les rotations de B2D (0 raccord brisé), les symétries mesurées
      - run: node tools/phases_b2d.mjs --verifie
      - run: node tools/phases_b2d.mjs --essai
      # B2D corrigé (prompt 185) : mode échange, transport aussi par la demi-période
      - run: node tools/phases_b2d.mjs --demi-periode --verifie
      - run: node tools/phases_b2d.mjs --demi-periode --essai
      - run: node tools/check_symetries_corpus.mjs --essai
      - run: node tools/symetries_64.mjs --verifie
      - run: node tools/symetries_64.mjs --essai
      # le corpus déposé sur Zenodo (prompt 182) : l'empreinte déposée est celle du dépôt, les DOI sont dans les pages
      - run: node tools/check_corpus_depot.mjs
      - run: node tools/check_corpus_depot.mjs --essai
      - run: node tools/verify_comptes_couleurs.mjs
      - run: python3 tools/verify_quadricolore.py --json
      - run: python3 tools/verify_cle_couleurs.py
      - run: python3 tools/verify_cle_damier.py
      - run: python3 tools/verify_pont_formes.py
      - run: python3 tools/protocole_general.py
      - run: python3 tools/derivation.py
      # les trois faits de la note « half-shift » v6 (prompt 242) relus sur le référent 360 : antipode, complément d'hexagramme, règle de parité (8 familles unifiées = une seule base yang)
      - run: python3 tools/check_note_v6.py
      - run: python3 tools/check_note_v6.py --essai
      # les résultats du prompt 246 relus sans le prototype : 512 grilles distinctes, parité spectrale, 128 orbites, complément, distance = 16 × Hamming, relations du Yi Jing
      - run: python3 tools/verifie_signatures_512.py
      # les fiches des 512 patterns unifiés (prompt 250) : fichier conforme au référent, 128 formes de 4, décodage inverse 512/512, complément = même forme, parité, aucune relation du Yi Jing hors complément
      - run: python3 tools/fiches_unifies.py --verifie
      - run: python3 tools/check_fiches_unifies.py
      - run: python3 tools/check_fiches_unifies.py --essai
      # prompt 250, point 3 : les 258 pages de fiche des formes disent ce que le fichier dit
      - run: python3 tools/convention_six_traits.py --verifie
      - run: python3 tools/convention_six_traits.py --essai
      - run: node tools/check_fiches_formes.mjs
      - run: node tools/check_fiches_formes.mjs --essai
      - run: python3 tools/pavage_miroirs.py --exhaustif --echantillons
      - run: python3 tools/verify_cle_pied.py
      - run: python3 tools/verify_invariants.py
      - run: python3 tools/transcription.py --json
      - run: python3 tools/verify_echelle.py
      - run: python3 tools/croix_ansee.py
      - run: python3 tools/verify_cadres_ordre12.py
      - run: node tools/check_resultats_etablis.mjs
      - run: node tools/check_resultats_etablis.mjs --essai
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-referents.yml
      - run: node tools/check_sorties_ci.mjs .github/workflows/check-referents.yml --essai
