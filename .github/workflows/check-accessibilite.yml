name: Accessibilite (axe-core, WCAG 2 AA)

# Les audits d'accessibilite ont corrige par lots le contraste du rouge et
# des gris, les liens fondus dans le texte, les zones defilantes hors
# d'atteinte du clavier, les libelles de formulaires. Ce workflow passe
# axe-core sur les pages racine, les articles et un echantillon des pages
# engendrees, et echoue a la premiere infraction -- voir la docstring de
# tools/check_accessibilite.mjs pour la portee.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ./.github/actions/playwright
        with:
          navigateur: chromium
          paquets: axe-core@4
      - name: Serveur statique local
        run: |
          npx --yes http-server . -p 8123 -s &
          npx --yes wait-on http://localhost:8123/index.html
      # la page du tirage du Yi King est auditée aussi APRÈS un tirage (le champ « Copier le lien » est écrit par le JavaScript de l'outil : prompt 208)
      - run: node tools/check_accessibilite.mjs --base-url http://localhost:8123
      # l'outil de tirage : King Wen d'abord, puis le numéro du site ; traits mutants et second hexagramme ; --essai : des résultats faussés sont refusés
      - run: node tools/check_tirage_outil.mjs --essai
      - run: node tools/check_tirage_outil.mjs --base-url http://localhost:8123
