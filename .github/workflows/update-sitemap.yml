name: Update sitemap

# Régénère sitemap.xml à chaque push sur main (voir scripts/generate-sitemap.js)
# et commite directement sur main s'il a changé. Le token vient d'une GitHub
# App dédiée (SITEMAP_APP_ID/SITEMAP_APP_PRIVATE_KEY), seule ajoutée aux
# bypass_actors du ruleset de main — voir docs/SITEMAP_APP.md pour la
# procédure d'installation, hors de portée d'un commit (réglages GitHub,
# secrets, ruleset : seul le propriétaire du dépôt peut les poser).
#
# Avant cette App : github-actions[bot] (GITHUB_TOKEN) n'a aucun moyen de
# contourner la revue de code owner exigée par le ruleset (GH013 au push
# direct) — la version précédente de ce workflow ouvrait donc une PR
# (branche update-sitemap, réinitialisée à chaque run) qu'il fallait
# approuver à la main, pour un fichier qui n'est jamais faux, seulement
# toujours un peu en retard de fraîcheur. Ce chantier remplace la PR par un
# commit direct, sans toucher à la protection pour qui que ce soit d'autre :
# le ruleset continue d'exiger la revue de code owner pour tout le monde,
# seule cette App précise — permission contents:write sur ce seul dépôt,
# rien d'autre — peut la contourner, et seulement pour ce workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-sitemap:
    if: github.event.head_commit.author.name != 'github-actions[bot]' && github.event.head_commit.author.name != 'sitemap-app[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Jeton de la GitHub App dédiée
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SITEMAP_APP_ID }}
          private-key: ${{ secrets.SITEMAP_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Committer directement sur main si le sitemap a changé
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml déjà à jour."
            exit 0
          fi

          # URL ajoutées / retirées entre l'ancien sitemap (HEAD) et le nouveau
          # (working tree), pour le message de commit — affiche le changement
          # sans avoir à ouvrir le diff.
          git show HEAD:sitemap.xml | grep -oP '(?<=<loc>)[^<]+' | sort -u > /tmp/old_urls.txt
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml | sort -u > /tmp/new_urls.txt
          ADDED=$(comm -13 /tmp/old_urls.txt /tmp/new_urls.txt)
          REMOVED=$(comm -23 /tmp/old_urls.txt /tmp/new_urls.txt)
          N_ADDED=$(printf '%s' "$ADDED" | grep -c . || true)
          N_REMOVED=$(printf '%s' "$REMOVED" | grep -c . || true)

          {
            echo "chore: sitemap.xml — +${N_ADDED:-0} / -${N_REMOVED:-0} URL"
            echo ""
            echo "Régénéré par scripts/generate-sitemap.js suite à ${{ github.sha }}."
            if [ -n "$ADDED" ]; then
              echo ""
              echo "Ajoutées ($N_ADDED) :"
              printf '%s\n' "$ADDED" | sed 's/^/- /'
            fi
            if [ -n "$REMOVED" ]; then
              echo ""
              echo "Retirées ($N_REMOVED) :"
              printf '%s\n' "$REMOVED" | sed 's/^/- /'
            fi
          } > /tmp/commit_msg.txt

          git config user.name "sitemap-app[bot]"
          git config user.email "sitemap-app[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -F /tmp/commit_msg.txt
          git push origin HEAD:main
