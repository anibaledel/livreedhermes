name: Fonds des cases conformes au calcul

# assets/bicolore-fonds.js pose un fond sur chaque case sans toucher au
# masque ; data/fonds/collection-v1.json décrit la collection. Contrôles :
#   - verify_fonds.mjs : tests 1 à 8 (masque inchangé, couverture, symboles,
#     fraction stable, raccord, contraste, codes, décomposition) et les
#     codes C8 / C1 inchangés ;
#   - calculs_fonds.mjs : data/fonds/collection-v1.calculs.json (les valeurs
#     que les pages reçoivent toutes faites) est à jour.
#   - verify_lecture_binaire.mjs : la lecture binaire des 256 motifs
#     tricolores (tests 12 à 15 : formule unique, zéro cas indéfini, aire
#     72 / 72, selles sans voisin jaune, cases coupées hors fond).

# Et, dans un navigateur (job « rendu ») :
#   - check_selecteur_fonds.mjs local : le sélecteur commun sur les trois
#     pages (création bicolore, une page de motif EN et FR, fond d'écran),
#     le motif de la page, 390 px, le redessin, les 512 pages et leurs
#     hreflang ;
#   - check_fond_ecran_animation.mjs local : l'animation bicolore (état en
#     URL, comptes par catégorie, densité, tuile du moteur, vidéo 1080 × 1920) ;
#   - check_export_pinterest.mjs local : les images des collections
#     sont identiques, pixel par pixel, au rendu des pages (dans les couleurs
#     de chaque collection, data/fonds/collections-pinterest.json).
# Et, sans navigateur : check_couleurs.mjs (un seul jeu de couleurs par
# défaut, assets/couleurs.js, et le contraste gris / crème) ;
# correspondance_motifs.mjs (nom d'image ↔ page, data/motifs-correspondance.json) ;
# check_fonds_ecran_source.mjs (fonds-ecran.html : une source, la copie
# intégrée périmée jamais relue).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/verify_fonds.mjs
      - run: node tools/calculs_fonds.mjs
      - run: node tools/verify_lecture_binaire.mjs
      - run: node tools/check_couleurs.mjs
      - run: node tools/correspondance_motifs.mjs
      - run: node tools/check_fonds_ecran_source.mjs

  rendu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/check_selecteur_fonds.mjs local
      - run: node tools/check_export_pinterest.mjs local --code P --echantillon 8
      - run: node tools/check_export_pinterest.mjs local --code B2D --echantillon 8
      - run: node tools/check_export_pinterest.mjs local --code B2 --echantillon 8
      - run: node tools/check_export_pinterest.mjs local --code B121 --echantillon 8
      - run: node tools/check_export_pinterest.mjs local --code B6D --echantillon 8
      - run: node tools/check_fond_ecran_animation.mjs local
