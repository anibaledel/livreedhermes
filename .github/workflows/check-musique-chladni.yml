name: Voir sa musique — le moteur et la page

# tools/verify_musique_chladni.mjs : le moteur (assets/musique-chladni-moteur.js) fait ce que dit
# sa consigne — son spectre d'un motif est celui de la recette de l'auteur (n° 91,
# tools/musique_chladni_recette_12.py, exécutée par python3), l'écho retrouve les motifs, les
# attaques sont vues à 0,45 s au moins l'une de l'autre, le pilote tient 8 images.
# tools/musique_chladni_donnees.mjs : data/musique-chladni-12.json est celui du dépôt (512 motifs
# tricolores = les 1024 entrées de data/fonds_ecran_v1.json dédoublonnées ; 272 lisibles par la règle
# du 3 octobre ; 136 à deux miroirs et lisibles = le bicolore ; 120 refusées, listées).
# tools/check_musique_chladni.mjs : la page, dans Chromium, avec un vrai morceau et un faux micro —
# six en-têtes, deux fenêtres, neuf variantes de case, trois modes, enregistrement, 390 et 360 px,
# rien d'envoyé.
# --essai : un moteur faussé, une page privée de son moteur doivent échouer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install numpy
      - run: node tools/verify_musique_chladni.mjs
      - run: node tools/verify_musique_chladni.mjs --essai
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tools/musique_chladni_donnees.mjs
      - run: node tools/check_musique_chladni.mjs local
      - run: node tools/check_musique_chladni.mjs local --essai
