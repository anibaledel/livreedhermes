name: Voir sa musique — le moteur et la page

# tools/verify_musique_chladni.mjs : le moteur (assets/musique-chladni-moteur.js) fait ce que dit
# sa consigne — son spectre d'un motif est celui de la recette de l'auteur (n° 91,
# tools/musique_chladni_recette_12.py, exécutée par python3), l'écho retrouve les motifs, les
# attaques sont vues à 0,45 s au moins l'une de l'autre, le pilote tient 8 images.
# tools/musique_chladni_donnees.mjs : data/musique-chladni-12.json est celui du dépôt (512 motifs
# tricolores = les 1024 entrées de data/fonds_ecran_v1.json dédoublonnées ; 272 lisibles par la règle
# du 3 octobre ; 136 à deux miroirs et lisibles ; 120 refusées, listées) ; les blocs de structure des
# trois ordres (data/musique-chladni/, paquet n° 158) : empreintes, P recalculé depuis les lb, les 272
# lb de l'ordre 12 identiques à la sortie de assets/lecture-binaire.js, collections des ordres 18 et 30.
# tools/check_musique_chladni.mjs : la page, dans Chromium, avec un vrai morceau et un faux micro —
# six en-têtes, deux fenêtres, six variantes de case, trois ordres, trois modes, enregistrement, 390 et 360 px,
# rien d'envoyé.
# tools/check_musique_webkit.mjs : la même page dans WebKit (profil iPhone), parcours Écouter → figure → Pause → Image.
# tools/check_musique_statique.mjs : les 11 pages se lisent sans JavaScript (aucun data-t vide, section « Comment ça marche »,
#   image d'exemple, « Voir aussi », titres en ordre) ; tools/figure_exemple_musique.mjs : l'image d'exemple et son JSON s'accordent.
# scripts/build-versions-modules.mjs --verifie : les ?v= des imports et des 11 pages suivent le contenu des modules.
# --essai : un moteur faussé, une page privée de son moteur, un texte vidé du HTML doivent échouer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install numpy
      - run: node tools/verify_musique_chladni.mjs
      - run: node tools/verify_musique_chladni.mjs --essai
      # le moteur de « Pavane — Voir sa musique » (prompt 211) : défilé, spectre, entre-deux, sur du son synthétique, sans navigateur
      - run: node tools/check_pavane_moteur.mjs
      - run: node tools/check_pavane_moteur.mjs --essai
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ./.github/actions/playwright
        with:
          navigateur: chromium
      - run: node tools/musique_chladni_donnees.mjs
      - run: node tools/check_musique_chladni.mjs local
      - run: node tools/check_musique_chladni.mjs local --essai
  webkit:
    # le moteur de Safari (Playwright WebKit, profil iPhone 13) : Écouter → figure → Pause → Image, sans erreur,
    # sans défilement horizontal. Ne prouve pas l'AAC ni la reprise du son d'iOS : voir l'en-tête du script.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ./.github/actions/playwright
        with:
          navigateur: webkit
      - run: node tools/check_musique_webkit.mjs local
      # l'avertissement photosensible et « Mouvement réduit » de la nouvelle interface (prompt 223), dans WebKit
      - run: node tools/check_pavane_webkit.mjs local
  statique:
    # la page se lit SANS JavaScript (prompt 202 : Bing, Copilot, Google) : le texte est dans le HTML des 11 pages,
    # la section « Comment ça marche », l'image d'exemple (vraie sortie du moteur) et « Voir aussi » aussi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check_musique_statique.mjs
      - run: node tools/check_musique_statique.mjs --essai
      - run: node tools/figure_exemple_musique.mjs --verifie
      # chaque import des modules porte ?v=<hash du fichier importé> (cache : les modules JS restent 4 h chez le visiteur, le HTML 10 min)
      - run: node scripts/build-versions-modules.mjs --verifie
