<style>
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--white);
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    text-align:center; padding:20px 24px 16px; border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    letter-spacing:.35em; font-size:11px; color:var(--red); text-transform:uppercase;
    }
  header h1{ font-weight:400; font-size:22px; letter-spacing:.04em; margin:8px 0 0; }

  .lang-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px;
    }
  .lang-btn{
    border:1px solid var(--line-strong); background:transparent; color:var(--dim);
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:6px 14px;
    cursor:pointer; transition:border-color .12s ease, color .12s ease;
  }
  .lang-btn.active{ border-color:var(--red); color:var(--red); }
  .lang-btn:disabled{ opacity:.35; cursor:default; }
  .lang-btn:not(:disabled):hover{ border-color:var(--gold); color:var(--gold); }

  .viewer{
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; padding:16px 24px; min-height:0;
    /* les flèches (44 px, à 10 px du bord) ont leur propre bande : l'image
       ne passe jamais dessous */
    padding-inline:64px;
  }
  .page-frame{
    /* A01 (audit du 4 octobre) : le cadre prend toute la place du lecteur,
       en largeur ET en hauteur. Sans hauteur résolue, le max-height:100% de
       l'image ne s'appuyait sur rien : elle prenait la largeur du cadre et
       une hauteur au prorata (722 px à 1363 px de large), débordait au-dessus
       et recouvrait les sept boutons de langue. Hausser un z-index aurait
       masqué le symptôme sans régler le dimensionnement. */
    width:100%; height:100%; min-width:0; min-height:0;
    max-width:min(94vw, 1400px); position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .page-frame img{
    /* l'image tient dans le cadre, proportions gardées, bordure au ras */
    display:block; width:auto; height:auto; min-width:0; min-height:0;
    max-width:100%; max-height:100%; object-fit:contain;
    border:1px solid var(--line); background:#050505;
    cursor:zoom-in; transition:opacity .25s ease;
  }
  .page-frame img.zoomed{
    cursor:zoom-out; max-width:none; max-height:none;
    width:auto; height:auto; position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%); z-index:50; max-width:96vw; max-height:96vh;
    box-shadow:0 0 0 2000px rgba(0,0,0,.88);
  }
  .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    background:transparent; border:1px solid var(--line-strong); color:var(--dim);
    width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, color .12s ease;
  }
  .nav-btn:hover{ border-color:var(--red); color:var(--red); }
  .nav-btn.prev{ left:10px; } .nav-btn.next{ right:10px; }
  .nav-btn:disabled{ opacity:.25; cursor:default; }
  @media (max-width:600px){
    /* Sur un écran de téléphone, .page-frame prend presque toute la largeur
       (max-width:94vw) : des boutons à 44px pleine opacité posés sur ses
       deux bords couvrent une part réelle de l'image. Le balayage devient
       la commande principale sur tactile (voir le script) ; ces boutons
       restent comme repli, plus petits et semi-transparents, pas au-dessus
       du contenu qu'on regarde. */
    /* ici, et seulement ici, les flèches se posent volontairement sur les
       bords de l'image : elles passent donc au-dessus d'elle (empilement
       voulu, pas un correctif de dimensionnement) */
    .viewer{ padding-inline:24px; }
    .nav-btn{ width:36px; height:36px; font-size:15px; opacity:.55; background:rgba(5,5,5,.55); z-index:1; }
    .nav-btn:active{ opacity:.9; }
  }

  footer{
    border-top:1px solid var(--line); padding:14px 24px 18px;
    display:flex; align-items:center; justify-content:center; gap:18px;
    font-size:11px; color:var(--dim);
  }
  footer input{
    width:auto; min-width:52px; background:#050505; border:1px solid var(--line-strong); color:var(--white);
    font-size:12px; padding:5px 6px; text-align:center;
  }
  footer .sep{ color:var(--line); }
  .jump-form{ display:flex; align-items:center; gap:6px; }
  .jump-form button{
    border:1px solid var(--line-strong); background:transparent; color:var(--dim);
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; cursor:pointer;
  }
  .jump-form button:hover{ border-color:var(--gold); color:var(--gold); }
  .pdf-link{ color:var(--dim); letter-spacing:.06em; text-decoration:underline; text-underline-offset:3px; }
  .pdf-link:hover{ color:var(--gold); }
  /* une langue sans interface traduite : le repli français est DIT */
  .ui-repli{ margin:10px 0 0; font-size:10.5px; color:var(--dim); letter-spacing:.06em; }

  .hint{
    /* Ni position:fixed ni superposition au pied de page : les deux se
       disputaient déjà la même bande en bas d'écran, et un fixed par-dessus
       le contenu est exactement le défaut signalé sur mobile. Flux normal,
       après le pied de page. */
    text-align:center; padding:0 24px 14px;
    font-size:9.5px; color:var(--dim); letter-spacing:.06em; opacity:.7;
  }
</style>

const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let currentLang = 'fr';
let currentIndex = 0;

function buildLangRow(){
  const row = document.getElementById('langRow');
  row.innerHTML = '';
  Object.entries(LANGS).forEach(([code, info])=>{
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (code===currentLang ? ' active' : '');
    btn.textContent = info.label + (info.ready ? '' : ' · bientôt');
    btn.lang = info.lang;  // le nom de chaque langue se prononce dans sa langue
    btn.setAttribute('aria-pressed', code===currentLang ? 'true' : 'false');
    btn.disabled = !info.ready;
    btn.addEventListener('click', ()=>{ if(info.ready) changerDeLangue(code); });
    row.appendChild(btn);
  });
}

function pages(){ return LANGS[currentLang].pages; }

// Une page se désigne par son CODE, pas par son rang : deux éditions n'ont
// aucune raison d'avoir le même nombre de pages. Une seule règle de
// correspondance, pour le champ « Aller à » comme pour le changement de
// langue : le code exact, ou le numéro sans son suffixe (« 004 » → 004A).
function indexDuCode(list, val){
  return list.findIndex(c => c === val || c.replace(/[A-Z]$/,'') === val);
}
// La page la plus proche d'un code absent : même numéro d'abord, puis le
// numéro voisin (à égalité, la page d'avant).
function cleDuCode(c){
  const m = /^(\d+)([A-Z]?)$/.exec(c);
  return m ? Number(m[1]) * 27 + (m[2] ? m[2].charCodeAt(0) - 64 : 0) : 0;
}
function indexLePlusProche(list, code){
  const k = cleDuCode(code);
  let best = 0;
  list.forEach((c, i)=>{ if(Math.abs(cleDuCode(c) - k) < Math.abs(cleDuCode(list[best]) - k)) best = i; });
  return best;
}
// Deux éditions n'ont pas la même pagination (111 pages, ancienne ; 115, celle de
// livre-medias) : « 081 » n'est pas la même page dans l'une et dans l'autre. En
// passant de l'une à l'autre, le code traverse la CONCORDANCE (tools/concordance_livre.py :
// la page de même texte), sinon la visionneuse ouvrirait une autre page sans le dire.
function codeEntreEditions(code, depuis, vers){
  if(depuis === vers || code === undefined) return code;
  if(depuis === PAGE_CODES){ return CONCORDANCE[code] || code; }
  // nouvelle → ancienne : l'ancien code dont la concordance donne ce code ; à défaut, celui
  // de la page nouvelle qui précède, la plus proche dans l'ordre
  const inverse = {};
  Object.keys(CONCORDANCE).forEach(a => { if(!(CONCORDANCE[a] in inverse)) inverse[CONCORDANCE[a]] = a; });
  for(let i = depuis.indexOf(code); i >= 0; i--){ if(depuis[i] in inverse) return inverse[depuis[i]]; }
  return vers[0];
}
function changerDeLangue(code){
  const listeAvant = pages();
  let avant = listeAvant[currentIndex];
  currentLang = code;
  const list = pages();
  avant = codeEntreEditions(avant, listeAvant, list);
  let idx = avant === undefined ? 0 : indexDuCode(list, avant);
  let avis = null;
  if(idx < 0 && list.length){
    idx = indexLePlusProche(list, avant);
    avis = texte().repliPage.replace('{code}', avant).replace('{proche}', list[idx]);
  }
  currentIndex = Math.max(0, idx);
  render();
  const el = document.getElementById('avisPage');
  el.textContent = avis || ''; el.hidden = !avis;
  buildLangRow();
}

// ---------- l'interface dans la langue du livre (audit A09) ----------
// Les textes viennent de scripts/langues.js (« lecteur »), écrits dans LANGS
// par scripts/build-langues.js. Une langue sans textes garde le français, et
// la visionneuse l'affiche (« Interface en français ») au lieu de laisser
// croire que tout est traduit.
function texte(){ return LANGS[currentLang].ui || LANGS.fr.ui; }
function appliquerUI(){
  const L = LANGS[currentLang], ui = texte(), repli = !L.ui;
  // <html lang> : la langue de ce qu'on lit et de ce qu'on entend (lecteur
  // d'écran) ; le français tant que l'interface est en repli
  document.documentElement.lang = repli ? 'fr' : L.lang;
  document.title = ui.titreDoc;
  document.getElementById('titreLecteur').textContent = ui.titre;
  document.getElementById('langRow').setAttribute('aria-label', ui.langues);
  document.getElementById('uiRepli').hidden = !repli;
  document.getElementById('prevBtn').setAttribute('aria-label', ui.prec);
  document.getElementById('nextBtn').setAttribute('aria-label', ui.suiv);
  document.getElementById('allerA').textContent = ui.allerA;
  const champ = document.getElementById('jumpInput');
  champ.placeholder = ui.exemple; champ.size = Math.max(4, [...ui.exemple].length + 1);
  document.getElementById('voirBtn').textContent = ui.voir;
  const pdf = document.getElementById('pdfLink');
  pdf.href = L.pdf; pdf.textContent = ui.pdf; pdf.hreflang = L.lang;
  // `download` ne vaut que vers le même domaine : sur livre-medias le PDF s'ouvre dans le navigateur
  pdf.toggleAttribute('download', !/^https?:/.test(L.pdf));
  document.getElementById('hintText').textContent = isTouchDevice ? ui.aideTactile : ui.aideClavier;
  const ev = repli ? LANGS.fr.evitement : L.evitement;
  if(ev) document.querySelectorAll('.skip-link').forEach((a)=>{ a.textContent = ev; });
}

function render(){
  const list = pages();
  if(!list.length) return;
  currentIndex = Math.max(0, Math.min(list.length-1, currentIndex));
  const code = list[currentIndex];
  const img = document.getElementById('pageImg');
  // le dossier des pages dit d'où vient l'édition : ce site (pages/<langue>) ou livre-medias
  img.src = `${LANGS[currentLang].pagesBase}/${code}.webp`;
  const ui = texte();
  img.alt = ui.alt.replace('{code}', code);
  img.classList.remove('zoomed');
  document.getElementById('pageLabel').textContent = ui.pageLabel.replace('{code}', code).replace('{i}', currentIndex+1).replace('{n}', list.length);
  // le champ « Aller à » dit toujours la page affichée : il s'écrit ici, là
  // où elle est connue (après une flèche, un balayage ou un changement de langue)
  document.getElementById('jumpInput').value = code;
  // l'avis de repli ne vaut que pour le changement de langue qui l'a produit
  document.getElementById('avisPage').hidden = true;
  appliquerUI();
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === list.length-1;
  // ?read=<lang>, pas ?lang= : c'est la forme que initFromURL() accepte SANS
  // rediriger (voir plus bas — ?lang= seul est l'ancien paramètre, traité
  // comme un lien externe et renvoyé vers la page canonique par langue).
  // Écrire ?lang= ici referait exactement la boucle que ce correctif retire :
  // rechargement, retour, ou lien partagé après avoir tourné une page
  // éjectait le lecteur vers fr/livre/ au lieu de rouvrir la page courante.
  const usp = new URLSearchParams();
  usp.set('read', currentLang); usp.set('page', code);
  history.replaceState(null, '', '?' + usp.toString());
}

document.getElementById('prevBtn').addEventListener('click', ()=>{ currentIndex--; render(); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ currentIndex++; render(); });
document.getElementById('pageImg').addEventListener('click', (e)=> e.target.classList.toggle('zoomed'));

document.getElementById('jumpForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const val = document.getElementById('jumpInput').value.trim().toUpperCase().padStart(3,'0');
  const list = pages();
  const idx = indexDuCode(list, val);
  if(idx >= 0){ currentIndex = idx; render(); }
});

window.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'Escape') document.getElementById('pageImg').classList.remove('zoomed');
});

// ---------- balayage (tactile) — pas de clavier sur téléphone, c'était la
// seule commande absente ; l'aide en bas dit ce qui marche sur l'appareil
// où elle s'affiche, pas un texte fixe qui suppose un clavier. ----------
// (le texte de l'aide, dans la langue du livre : appliquerUI())

(function initSwipe(){
  const viewer = document.querySelector('.viewer');
  let startX = null, startY = null;
  const SWIPE_THRESHOLD = 40; // px — au-delà, un balayage plutôt qu'un tapoter
  viewer.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive:true });
  viewer.addEventListener('touchend', (e)=>{
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null; startY = null;
    // Horizontal net, pas un geste vertical (défilement, même si la page
    // ne défile pas ici) ni un simple tapoter (qui doit encore zoomer).
    if(Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
    if(dx < 0) document.getElementById('nextBtn').click();
    else document.getElementById('prevBtn').click();
  }, { passive:true });
})();

// ---------- P0-4 : redirection de l'ancien paramètre ?lang= vers l'URL
// canonique par langue, sauf quand on arrive via ?read= (lien "Lire le
// livre en ligne" déjà envoyé depuis la page canonique elle-même — ne pas
// rediriger dans ce cas, sous peine de boucle). ----------
// @canoniques:start — engendré par scripts/build-langues.js, ne pas éditer ici
const CANONICAL_BY_LANG = {
  fr: 'https://anibal-amiot.com/fr/livre/',
  en: 'https://anibal-amiot.com/en/book/',
  es: 'https://anibal-amiot.com/es/libro/',
  th: 'https://anibal-amiot.com/th/book/',
  zh: 'https://anibal-amiot.com/zh/book/',
  ru: 'https://anibal-amiot.com/ru/book/',
  pt: 'https://anibal-amiot.com/pt/book/',
  hi: 'https://anibal-amiot.com/hi/book/',
  de: 'https://anibal-amiot.com/de/book/',
  it: 'https://anibal-amiot.com/it/book/',
  ja: 'https://anibal-amiot.com/ja/book/',
};
// @canoniques:end

// ---------- init depuis l'URL ----------
(function initFromURL(){
  const params = new URLSearchParams(location.search);
  const readLang = params.get('read');
  const legacyLang = params.get('lang');
  if(!readLang && legacyLang && CANONICAL_BY_LANG[legacyLang]){
    location.replace(CANONICAL_BY_LANG[legacyLang]);
    return;
  }
  const lang = readLang || legacyLang;
  if(lang && LANGS[lang] && LANGS[lang].ready) currentLang = lang;
  const page = params.get('page');
  buildLangRow();
  if(page){
    const idx = pages().indexOf(page);
    if(idx >= 0) currentIndex = idx;
  }
  render();
})();
</script>
