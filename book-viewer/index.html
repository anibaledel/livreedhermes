<style>
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--white);
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    text-align:center; padding:20px 24px 16px; border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    letter-spacing:.35em; font-size:11px; color:var(--red); text-transform:uppercase;
    }
  header h1{ font-weight:400; font-size:22px; letter-spacing:.04em; margin:8px 0 0; }

  .lang-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px;
    }
  .lang-btn{
    border:1px solid var(--line-strong); background:transparent; color:var(--dim);
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:6px 14px;
    cursor:pointer; transition:border-color .12s ease, color .12s ease;
  }
  .lang-btn.active{ border-color:var(--red); color:var(--red); }
  .lang-btn:disabled{ opacity:.35; cursor:default; }
  .lang-btn:not(:disabled):hover{ border-color:var(--gold); color:var(--gold); }

  .viewer{
    flex:1; display:flex; align-items:center; justify-content:center;
    position:relative; padding:16px 24px; min-height:0;
  }
  .page-frame{
    max-width:min(94vw, 1400px); max-height:100%; position:relative;
    display:flex; align-items:center; justify-content:center; min-height:0;
  }
  .page-frame img{
    width:100%; height:100%; max-width:100%; max-height:100%; object-fit:contain;
    border:1px solid var(--line); background:#050505;
    cursor:zoom-in; transition:opacity .25s ease;
  }
  .page-frame img.zoomed{
    cursor:zoom-out; max-width:none; max-height:none;
    width:auto; height:auto; position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%); z-index:50; max-width:96vw; max-height:96vh;
    box-shadow:0 0 0 2000px rgba(0,0,0,.88);
  }
  .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    background:transparent; border:1px solid var(--line-strong); color:var(--dim);
    width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, color .12s ease;
  }
  .nav-btn:hover{ border-color:var(--red); color:var(--red); }
  .nav-btn.prev{ left:10px; } .nav-btn.next{ right:10px; }
  .nav-btn:disabled{ opacity:.25; cursor:default; }
  @media (max-width:600px){
    /* Sur un écran de téléphone, .page-frame prend presque toute la largeur
       (max-width:94vw) : des boutons à 44px pleine opacité posés sur ses
       deux bords couvrent une part réelle de l'image. Le balayage devient
       la commande principale sur tactile (voir le script) ; ces boutons
       restent comme repli, plus petits et semi-transparents, pas au-dessus
       du contenu qu'on regarde. */
    .nav-btn{ width:36px; height:36px; font-size:15px; opacity:.55; background:rgba(5,5,5,.55); }
    .nav-btn:active{ opacity:.9; }
  }

  footer{
    border-top:1px solid var(--line); padding:14px 24px 18px;
    display:flex; align-items:center; justify-content:center; gap:18px;
    font-size:11px; color:var(--dim);
  }
  footer input{
    width:52px; background:#050505; border:1px solid var(--line-strong); color:var(--white);
    font-size:12px; padding:5px 6px; text-align:center;
  }
  footer .sep{ color:var(--line); }
  .jump-form{ display:flex; align-items:center; gap:6px; }
  .jump-form button{
    border:1px solid var(--line-strong); background:transparent; color:var(--dim);
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; cursor:pointer;
  }
  .jump-form button:hover{ border-color:var(--gold); color:var(--gold); }

  .hint{
    /* Ni position:fixed ni superposition au pied de page : les deux se
       disputaient déjà la même bande en bas d'écran, et un fixed par-dessus
       le contenu est exactement le défaut signalé sur mobile. Flux normal,
       après le pied de page. */
    text-align:center; padding:0 24px 14px;
    font-size:9.5px; color:var(--dim); letter-spacing:.06em; opacity:.7;
  }

  <button class="nav-btn next" id="nextBtn" aria-label="Page suivante">›</button>
</div>

<footer>

  <form class="jump-form" id="jumpForm">

    <input type="text" id="jumpInput" placeholder="ex. 042">
    <button type="submit">Voir</button>
  </form>
</footer>

<div class="hint" id="hintText">← → pour naviguer · clic sur la page pour zoomer</div>

<script>
// ---------- pages disponibles (même pagination pour les 4 langues prêtes : FR/EN/ES/TH) ----------
const PAGE_CODES = ["000A","000B","001","002","003","004A","004B","004C","005","006","007","008A","008B","008C","009","010","011","012A","012B","012C","013","014","015","016","017","018A","018B","018C","019","020","021","022","023","024A","024B","024C","025","026","027","028A","028B","028C","029","030","031","032","033","034","035","036","037","038A","038B","038C","039","040","041","042","043","044","045","046","047","048","049","050","051","052","053","054","055","056","057","058","059","060","061","062A","062B","062C","063","064","065","066","067","068","069","070","071","072","073","074","075","076A","077","078","079","080","081","082","083","084","085","086","087","088","089","090","091","092","093"];

// @langues:start — engendré par scripts/build-langues.js, ne pas éditer ici
const LANGS = {
  fr: { label: 'Français', pages: PAGE_CODES, ready: true },
  en: { label: 'English', pages: PAGE_CODES, ready: true },
  es: { label: 'Español', pages: PAGE_CODES, ready: true },
  th: { label: 'ไทย', pages: PAGE_CODES, ready: true },
  zh: { label: '简体中文', pages: PAGE_CODES, ready: true },
  ru: { label: 'Русский', pages: PAGE_CODES, ready: true },
  pt: { label: 'Português', pages: PAGE_CODES, ready: true },
};
// @langues:end

let currentLang = 'fr';
let currentIndex = 0;

function buildLangRow(){
  const row = document.getElementById('langRow');
  row.innerHTML = '';
  Object.entries(LANGS).forEach(([code, info])=>{
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (code===currentLang ? ' active' : '');
    btn.textContent = info.label + (info.ready ? '' : ' · bientôt');
    btn.disabled = !info.ready;
    btn.addEventListener('click', ()=>{ if(info.ready){ currentLang = code; currentIndex = 0; render(); buildLangRow(); }});
    row.appendChild(btn);
  });
}

function pages(){ return LANGS[currentLang].pages; }

function render(){
  const list = pages();
  if(!list.length) return;
  currentIndex = Math.max(0, Math.min(list.length-1, currentIndex));
  const code = list[currentIndex];
  const img = document.getElementById('pageImg');
  img.src = `pages/${currentLang}/${code}.webp`;
  img.alt = 'Page ' + code;
  img.classList.remove('zoomed');
  document.getElementById('pageLabel').textContent = `Page ${code} — ${currentIndex+1} / ${list.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === list.length-1;
  // ?read=<lang>, pas ?lang= : c'est la forme que initFromURL() accepte SANS
  // rediriger (voir plus bas — ?lang= seul est l'ancien paramètre, traité
  // comme un lien externe et renvoyé vers la page canonique par langue).
  // Écrire ?lang= ici referait exactement la boucle que ce correctif retire :
  // rechargement, retour, ou lien partagé après avoir tourné une page
  // éjectait le lecteur vers fr/livre/ au lieu de rouvrir la page courante.
  const usp = new URLSearchParams();
  usp.set('read', currentLang); usp.set('page', code);
  history.replaceState(null, '', '?' + usp.toString());
}

document.getElementById('prevBtn').addEventListener('click', ()=>{ currentIndex--; render(); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ currentIndex++; render(); });
document.getElementById('pageImg').addEventListener('click', (e)=> e.target.classList.toggle('zoomed'));

document.getElementById('jumpForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const val = document.getElementById('jumpInput').value.trim().toUpperCase().padStart(3,'0');
  const list = pages();
  const idx = list.findIndex(c => c === val || c.replace(/[A-Z]$/,'') === val);
  if(idx >= 0){ currentIndex = idx; render(); }
});

window.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'Escape') document.getElementById('pageImg').classList.remove('zoomed');
});

// ---------- balayage (tactile) — pas de clavier sur téléphone, c'était la
// seule commande absente ; l'aide en bas dit ce qui marche sur l'appareil
// où elle s'affiche, pas un texte fixe qui suppose un clavier. ----------
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
document.getElementById('hintText').textContent = isTouchDevice
  ? 'Balayer à gauche/à droite pour naviguer · toucher la page pour zoomer'
  : '← → pour naviguer · clic sur la page pour zoomer';

(function initSwipe(){
  const viewer = document.querySelector('.viewer');
  let startX = null, startY = null;
  const SWIPE_THRESHOLD = 40; // px — au-delà, un balayage plutôt qu'un tapoter
  viewer.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, { passive:true });
  viewer.addEventListener('touchend', (e)=>{
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null; startY = null;
    // Horizontal net, pas un geste vertical (défilement, même si la page
    // ne défile pas ici) ni un simple tapoter (qui doit encore zoomer).
    if(Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
    if(dx < 0) document.getElementById('nextBtn').click();
    else document.getElementById('prevBtn').click();
  }, { passive:true });
})();

// ---------- P0-4 : redirection de l'ancien paramètre ?lang= vers l'URL
// canonique par langue, sauf quand on arrive via ?read= (lien "Lire le
// livre en ligne" déjà envoyé depuis la page canonique elle-même — ne pas
// rediriger dans ce cas, sous peine de boucle). ----------
// @canoniques:start — engendré par scripts/build-langues.js, ne pas éditer ici
const CANONICAL_BY_LANG = {
  fr: 'https://anibal-amiot.com/fr/livre/',
  en: 'https://anibal-amiot.com/en/book/',
  es: 'https://anibal-amiot.com/es/libro/',
  th: 'https://anibal-amiot.com/th/book/',
  zh: 'https://anibal-amiot.com/zh/book/',
  ru: 'https://anibal-amiot.com/ru/book/',
  pt: 'https://anibal-amiot.com/pt/book/',
};
// @canoniques:end

// ---------- init depuis l'URL ----------
(function initFromURL(){
  const params = new URLSearchParams(location.search);
  const readLang = params.get('read');
  const legacyLang = params.get('lang');
  if(!readLang && legacyLang && CANONICAL_BY_LANG[legacyLang]){
    location.replace(CANONICAL_BY_LANG[legacyLang]);
    return;
  }
  const lang = readLang || legacyLang;
  if(lang && LANGS[lang] && LANGS[lang].ready) currentLang = lang;
  const page = params.get('page');
  buildLangRow();
  if(page){
    const idx = pages().indexOf(page);
    if(idx >= 0) currentIndex = idx;
  }
  render();
})();
</script>
