name = "livreedhermes-soutien"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Créé par `wrangler kv:namespace create SOUTIEN_KV` (voir README.md) —
# remplace ensuite l'id ci-dessous par celui que la commande t'a donné.
[[kv_namespaces]]
binding = "SOUTIEN_KV"
id = "045fad05c15a42d59fc56a7b0bf72ac8"

# STRIPE_SECRET_KEY et STRIPE_WEBHOOK_SECRET ne sont JAMAIS mis ici.
# Ce sont des secrets Cloudflare (wrangler secret put ...), voir README.md.
[vars]
STRIPE_MIN_AMOUNT_CENTS = 100
ALLOWED_ORIGIN = "https://anibal-amiot.com"

# Limites de débit par adresse IP (liaisons « ratelimit » de Cloudflare ; la
# période ne peut valoir que 10 ou 60 secondes). namespace_id : un entier
# propre à chaque limite, choisi librement, unique dans le compte Cloudflare.
#   LIMITE_PAIEMENT : création de sessions Stripe — 5 par minute et par IP.
#   LIMITE_LECTURE  : /claim-token et /verify-access — 30 par minute et par IP
#                     (la page de retour de paiement réessaie jusqu'à 9 fois).
[[unsafe.bindings]]
name = "LIMITE_PAIEMENT"
type = "ratelimit"
namespace_id = "1701"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "LIMITE_LECTURE"
type = "ratelimit"
namespace_id = "1702"
simple = { limit = 30, period = 60 }
