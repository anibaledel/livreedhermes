<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Merci pour votre soutien — La Livrée d'Hermès</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .box{ max-width:520px; text-align:center; }
  h1{ font-weight:400; font-size:24px; letter-spacing:.03em; color:var(--gold); margin-bottom:16px; }
  p{ font-size:14.5px; line-height:1.8; color:var(--dim); }
  a.btn{
    display:inline-block; margin-top:24px; border:1px solid var(--line-strong); color:var(--dim);
    text-decoration:none; padding:12px 22px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    transition:border-color .12s ease, color .12s ease;
  }
  a.btn:hover{ border-color:var(--gold); color:var(--gold); }
  #status{ font-size:12.5px; color:var(--dim); opacity:.75; }
</style>
<link rel="stylesheet" href="style.css">
<!-- @head-icons:start — engendré depuis includes/, ne pas éditer ici (voir scripts/build-header.js) -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- @head-icons:end -->
</head>
<body>
<!-- @header:start — engendré depuis includes/, ne pas éditer ici (voir scripts/build-header.js) -->
<header class="site-header">
  <img src="assets/title-logo-footer.png" alt="La Livrée d'Hermès" width="264" height="65" style="width:264px;max-width:80%;height:auto;display:block;margin:0 auto 10px;">
  <div id="google_translate_element" class="gtranslate-slot"></div>
</header>
<!-- @header:end -->
  <div class="box">
    <h1>Merci pour votre soutien</h1>
    <p id="status">Validation de votre accès en cours...</p>
    <p id="doneMsg" style="display:none;">Votre accès aux téléchargements est débloqué sur cet appareil. Revenez sur la page qui vous intéresse et téléchargez librement les fichiers SVG et PDF.</p>
    <a class="btn" href="index.html">Retour au site</a>
  </div>

<script>
(async function(){
  const WORKER_BASE_URL = 'https://livreedhermes-soutien.anibalamiot.workers.dev';
  const statusEl = document.getElementById('status');
  const doneEl = document.getElementById('doneMsg');
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session_id');
  if(!sessionId){
    statusEl.textContent = "Aucune session de paiement trouvée dans le lien.";
    return;
  }
  // Déjà réclamé sur cet appareil : inutile de redemander le jeton au
  // serveur — un rechargement de cette page ne doit pas consommer la
  // fenêtre de récupération ni afficher une erreur trompeuse.
  if(localStorage.getItem('soutien_token')){
    statusEl.style.display = 'none';
    doneEl.style.display = 'block';
    return;
  }
  try{
    const res = await fetch(`${WORKER_BASE_URL}/claim-token?session_id=${encodeURIComponent(sessionId)}`);
    const data = await res.json();
    if(data.token){
      localStorage.setItem('soutien_token', data.token);
      statusEl.style.display = 'none';
      doneEl.style.display = 'block';
    } else {
      statusEl.textContent = "Impossible de valider cette session pour l'instant — réessayez dans quelques instants, ou contactez-nous si le problème persiste.";
    }
  }catch(e){
    statusEl.textContent = "Impossible de contacter le service de validation.";
  }
})();
</script>
<!-- @translate:start — engendré depuis includes/, ne pas éditer ici (voir scripts/build-header.js) -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'fr', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<!-- @translate:end -->
</body>
</html>
