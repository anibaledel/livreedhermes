<!doctype html>
<html>
<head><meta charset="utf-8"><title>HKDF-SHA256 (Web Crypto) — vecteurs RFC 5869 (navigateur)</title></head>
<body>
<pre id="out">running...</pre>
<script type="module">
import { runTests } from './test_hkdf.mjs';

const out = document.getElementById('out');
function log(line) { console.log(line); out.textContent += line + '\n'; }

try {
  const results = await runTests();
  out.textContent = '';
  for (const r of results) log('  ' + r);
  log(`\n${results.length}/${results.length} vecteurs HKDF-SHA256 conformes (Web Crypto native, RFC 5869).`);
  window.__TEST_OK__ = true;
} catch (e) {
  out.textContent = '';
  log('ÉCHEC : ' + e.message);
  window.__TEST_OK__ = false;
}
window.__TEST_DONE__ = true;
</script>
</body>
</html>
